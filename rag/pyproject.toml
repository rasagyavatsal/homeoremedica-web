[project]
name = "homeoremedica-chat"
version = "0.1.0"
description = "Grounded RAG chat service for the HomeoRemedica corpus"
requires-python = "==3.14.*"
dependencies = [
  "fastapi>=0.116.1,<1",
  "google-cloud-storage>=3.13.1,<4",
  "google-genai>=2.18.1,<3",
  "pydantic>=2.12.5,<3",
  "pydantic-settings>=2.10.1,<3",
  "sqlite-vec==0.1.9",
  "uvicorn>=0.35.0,<1",
]

[project.scripts]
homeoremedica-chat = "homeoremedica_chat.cli:main"

[build-system]
requires = ["uv-build>=0.11.23,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "pyright>=1.1.405,<2",
  "pytest>=8.4.2,<9",
  "ruff>=0.12.11,<0.13",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 100
target-version = "py314"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.uv]
required-version = ">=0.11.23,<0.12"
